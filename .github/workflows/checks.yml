name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/test-update-blinker.py
      - run: for cask in Casks/*.rb; do ruby -c "$cask" || exit 1; done
      - run: git diff --check
