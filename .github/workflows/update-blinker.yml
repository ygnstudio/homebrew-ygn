name: Update Blinker cask

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag (for example v0.4.0); leave empty to check latest
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-blinker-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test updater
        run: python3 Scripts/test-update-blinker.py
      - name: Verify release and update cask
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 Scripts/update-blinker.py "$RELEASE_TAG" --write
          else
            python3 Scripts/update-blinker.py --latest --write
          fi
      - name: Validate cask syntax
        run: ruby -c Casks/blinker.rb
      - name: Commit verified version
        run: |
          if git diff --quiet -- Casks/blinker.rb; then exit 0; fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/blinker.rb
          git commit -m "chore(blinker): update verified stable release"
          git push
